name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PEM_KEY }}
          
          script: |
            cd /home/ubuntu/6weeks_mean
            git pull origin main
            sudo npm install
            sudo npm run build
            
            pm2 delete frontend || true
            
            pm2 serve dist/front-end 4200 --name "frontend" --spa
            
            pm2 save
